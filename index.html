<script>
/* ====== CONTENT ====== */
const U=[
["Present continuous (I am doing)","am/is/are + -ing for actions in progress now or around now, and for changes that have started to happen."],
["Present simple (I do)","Use it for things in general, repeated actions and permanent facts. Questions and negatives use do/does."],
["Present continuous and present simple 1","Continuous = happening now or temporary. Simple = general or permanent. “I’m always doing” = too often."],
["Present continuous and present simple 2","State verbs (know, want, like, need…) are not normally continuous. Also: think, see/hear/smell/taste, am/is/are being."]
];
/* e: id, u=unit, t=title, i=instructions, s=first number, q=items [prompt, answer(s)], o=options (matching), L=custom labels.
   Answers: variants separated by |. Contractions are treated as equal to full forms. */
const E=[
{id:"1.1",u:1,t:"What’s happening?",s:2,i:"Choose from: cross, hide, scratch, tie, wave. Write only the missing words (example: She’s taking a picture).",q:[
["He __ a shoelace.","is tying"],["They __ the road.","are crossing"],["He __ his head.","is scratching"],["She __ behind a tree.","is hiding"],["She __ to somebody.","is waving"]]},
{id:"1.2",u:1,t:"Which sentence goes with which?",s:1,i:"Choose the sentence that follows each one on the left.",o:["I’m getting hungry.","They’re lying.","It’s starting to rain.","They’re trying to sell it.","It’s getting late.","I’m trying to work.","I’m staying with friends.","The company is losing money."],q:[
["Please don’t make so much noise.","f"],["We need to leave soon.","e"],["I don’t have anywhere to live right now.","g"],["I need to eat something soon.","a"],["They don’t need their car any more.","d"],["Things are not so good at work.","h"],["It isn’t true what they say.","b"],["We’re going to get wet.","c"]]},
{id:"1.3",u:1,t:"Write questions",s:2,i:"Use the present continuous. Write the full question.",q:[
["What’s the matter? (why / you / cry)","why are you crying"],["Where’s your mother? (she / work / today)","is she working today"],["I haven’t seen you for ages. (what / you / do / these days)","what are you doing these days"],["Amy is a student. (what / she / study)","what is she studying"],["Who are those people? (what / they / do)","what are they doing"],["I heard you started a new job. (you / enjoy / it)","are you enjoying it"],["We’re not in a hurry. (why / you / walk / so fast)","why are you walking so fast"]]},
{id:"1.4",u:1,t:"Positive or negative?",s:3,i:"Put the verb into the correct form, positive (I’m doing) or negative (I’m not doing). Write only the verb phrase.",q:[
["You can turn off the radio. __ (I / listen) to it.","’m not listening"],["Kate phoned last night. She’s on holiday with friends. __ (She / have) a great time and doesn’t want to come back.","’s having"],["Andrew started evening classes recently. __ (He / learn) Japanese.","’s learning"],["Paul and Sarah have had an argument and now __ (they / speak) to one another.","aren’t speaking"],["The situation is already very bad and now __ (it / get) worse.","’s getting"],["Tim __ (work) today. He’s taken the day off.","isn’t working"],["__ (I / look) for Sophie. Do you know where she is?","’m looking"],["The washing machine has been repaired. __ (It / work) now.","’s working"],["__ (They / build) a new hospital. It will be finished next year.","’re building"],["Ben is a student, but he’s not very happy. __ (He / enjoy) his course.","isn’t enjoying"],["__ (The weather / change). Look at those clouds. I think it’s going to rain.","’s changing"],["Dan has been in the same job for a long time. __ (He / start) to get bored with it.","’s starting"]]},
{id:"2.1",u:2,t:"Complete the sentences",s:2,i:"Use: cause(s), close(s), connect(s), go(es), live(s), take(s).",q:[
["Ben and Jack __ to the same school.","go"],["Bad driving __ many accidents.","causes"],["The museum __ at 4 o’clock on Sundays.","closes"],["My parents __ in a very small flat.","live"],["The Olympic Games __ place every four years.","take"],["The Panama Canal __ the Atlantic and Pacific oceans.","connects"]]},
{id:"2.2",u:2,t:"Put the verb into the correct form",s:2,i:"Present simple, positive, negative or question.",q:[
["What time __ (the banks / close) here?","do the banks close"],["I have a car, but I __ (not / use) it much.","don’t use"],["Where __ (Maria / come) from? Is she Spanish?","does Maria come"],["‘What __ (you / do)?’ ‘I’m an electrician.’","do you do"],["Look at this sentence. What __ (this word / mean)?","does this word mean"],["David isn’t very fit. He __ (not / do) any sport.","doesn’t do"],["It __ (take) me an hour to get to work in the morning. How long __ (it / take) you?","takes","does it take"]]},
{id:"2.3",u:2,t:"Complete with the verbs",s:3,i:"Use: believe, eat, flow, make, rise, tell, translate. Sometimes you need the negative.",q:[
["The sun __ in the east.","rises"],["Bees __ honey.","make"],["Vegetarians __ meat.","don’t eat"],["An atheist __ in God.","doesn’t believe"],["An interpreter __ from one language into another.","translates"],["Liars are people who __ the truth.","don’t tell"],["The River Amazon __ into the Atlantic Ocean.","flows"]]},
{id:"2.4",u:2,t:"Questions about Lisa",s:2,i:"You ask Lisa questions about herself and her family. Write the full question.",q:[
["Perhaps Lisa’s sister plays tennis too. You want to know. Ask Lisa.","does your sister play tennis"],["You know that Lisa goes to the cinema a lot. You want to know how often. Ask her.","how often do you go to the cinema"],["You know that Lisa’s brother works. You want to know what he does. Ask Lisa.","what does your brother do"],["You’re not sure whether Lisa speaks Spanish. You want to know. Ask her.","do you speak Spanish"],["You don’t know where Lisa’s grandparents live. You want to know. Ask Lisa.","where do your grandparents live"]]},
{id:"2.5",u:2,t:"I promise / I apologise…",s:2,i:"Use: I agree, I apologise, I insist, I promise, I recommend.",q:[
["I won’t tell anybody what you said. __.","I promise"],["(in a restaurant) You must let me pay for the meal. __.","I insist"],["__ for what I said. I shouldn’t have said it.","I apologise|I apologize"],["The new restaurant in Baker Street is very good. __ it.","I recommend"],["I think you’re absolutely right. __ with you.","I agree"]]},
{id:"3.1",u:3,t:"Are the underlined verbs OK?",s:2,i:"Write OK, or write the correct form of the underlined verb.",q:[
["How often <u>are you going</u> to the cinema?","do you go"],["Ben <u>tries</u> to find a job, but he hasn’t had any luck yet.","is trying"],["Martina <u>is phoning</u> her mother every day.","phones"],["The moon <u>goes</u> round the earth in about 27 days.","OK"],["Can you hear those people? What <u>do they talk</u> about?","are they talking"],["What <u>do you do</u> in your spare time?","OK"],["Sarah is a vegetarian. She <u>doesn’t eat</u> meat.","OK"],["I must go now. It <u>gets</u> late.","is getting"],["‘Come on! It’s time to leave.’ ‘OK, I <u>come</u>.’","’m coming"],["Paul is never late. He<u>’s always starting</u> work on time.","always starts"],["They don’t get on well. They<u>’re always arguing</u>.","OK"]]},
{id:"3.2",u:3,t:"Continuous or simple?",L:["2a","2b","3a","3b","4a","4b","5a","5b"],i:"Put the verb into the correct form, present continuous or present simple.",q:[
["‘__ (you / listen) to the radio?’ ‘No, you can turn it off.’","are you listening"],["‘__ (you / listen) to the radio a lot?’ ‘No, not very often.’","do you listen"],["The River Nile __ (flow) into the Mediterranean.","flows"],["The river __ (flow) very fast today – much faster than usual.","is flowing"],["I’m not very active. __ (I / not / do) any sport.","don’t do"],["What __ (you / usually / do) at weekends?","do you usually do"],["Rachel is in New York right now. __ (She / stay) at the Park Hotel.","’s staying"],["__ (She / always / stay) there when she’s in New York.","always stays"]]},
{id:"3.3",u:3,t:"Continuous or simple?",s:2,i:"Put the verb into the correct form, present continuous or present simple.",q:[
["Julia is good at languages. __ (She / speak) four languages very well.","speaks"],["Are you ready yet? __ (Everybody / wait) for you.","is waiting"],["I’ve never heard this word. How __ (you / pronounce) it?","do you pronounce"],["Kate __ (not / work) this week. She’s on holiday.","isn’t working"],["I think my English __ (improve) slowly. It’s better than it was.","is improving"],["Nicola __ (live) in Manchester. She has never lived anywhere else.","lives"],["Can we stop walking soon? __ (I / start) to get tired.","’m starting"],["Sam and Tina are in Madrid right now. __ (They / visit) a friend of theirs.","are visiting"],["‘What __ (your father / do)?’ ‘He’s an architect.’","does your father do"],["It took me an hour to get to work this morning. Most days __ (it / not / take) so long.","doesn’t take"],["I __ (learn) to drive. My driving test is next month. My father __ (teach) me.","’m learning","is teaching"]]},
{id:"3.4",u:3,t:"Always -ing",s:2,i:"Finish B’s sentences. Use always + -ing.",q:[
["A: The car has broken down again.<br>B: That car is useless. It __.","’s always breaking down"],["A: Look! You’ve made the same mistake again.<br>B: Oh no, not again! I __.","’m always making the same mistake|’m always making that mistake"],["A: Oh, I’ve left my phone at home again.<br>B: Typical! __.","’re always leaving your phone at home"]]},
{id:"4.1",u:4,t:"Continuous or simple?",s:2,i:"Put the verb into the correct form, present continuous or present simple.",q:[
["Alan says he’s 90 years old, but nobody __ (believe) him.","believes"],["She told me her name, but __ (I / not / remember) it now.","don’t remember|can’t remember"],["Don’t put the dictionary away. __ (I / use) it.","’m using"],["Don’t put the dictionary away. __ (I / need) it.","need"],["Air __ (consist) mainly of nitrogen and oxygen.","consists"],["Who is that man? What __ (he / want)?","does he want"],["Who is that man? Why __ (he / look) at us?","is he looking"],["Who is that man? __ (you / recognise) him?","do you recognise|do you recognize"],["__ (I / think) of selling my car. Would you be interested in buying it?","’m thinking"],["I can’t make up my mind. What __ (you / think) I should do?","do you think"],["Gary wasn’t well earlier, but __ (he / seem) OK now.","seems"]]},
{id:"4.2",u:4,t:"Make sentences",s:2,i:"Use the words in brackets.",q:[
["‘Are you OK? You look worried.’ (I / think)","’m thinking"],["(who / this umbrella / belong to)","who does this umbrella belong to"],["(this / smell / good)","this smells good"],["Excuse me. (anybody / sit / there)","is anybody sitting there"],["These gloves are too small. (these gloves / not / fit / me)","these gloves don’t fit me"]]},
{id:"4.3",u:4,t:"Are the underlined verbs OK?",s:3,i:"Write OK, or write the correct form of the underlined verb.",q:[
["<u>I’m feeling</u> hungry. Is there anything to eat?","OK|I feel"],["I’ve never eaten that fruit. What <u>is it tasting</u> like?","does it taste"],["I’m not sure what she does. I <u>think</u> she works in a shop.","OK"],["Look over there. What <u>are you seeing</u>?","do you see"],["You’re very quiet. What <u>are you thinking</u> about?","OK"]]},
{id:"4.4",u:4,t:"is/are being or is/are?",s:2,i:"Use is/are being (continuous) or is/are (simple).",q:[
["You’ll like Sophie when you meet her. She __ very nice.","is"],["Sarah __ very nice to me at the moment. I wonder why.","is being"],["They __ very happy. They’ve just got married.","are"],["You’re normally very patient, so why __ so unreasonable about waiting ten more minutes?","are you being"],["Would you like something to eat? __ hungry?","are you"]]}
];

/* ====== ENGINE ====== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/n't\b/g," not").replace(/'s\b/g," is").replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/[?.!,;:“”"]/g,"").replace(/\s+/g," ").trim();
const ok=(r,a)=>{const n=norm(r);return !!n&&a.split("|").some(v=>{v=norm(v);return n===v||n.endsWith(" "+v)})};
const show=a=>a.split("|")[0];
let S={},sent=false;

function build(){
  $("#exs").innerHTML=E.map((e,x)=>{
    const rows=e.q.map((q,i)=>{
      const lab=e.L?e.L[i]:e.s+i;let p=q[0],f;
      if(e.o){f=`<select data-x="${x}" data-i="${i}" data-b="0" aria-label="Answer for ${lab}"><option value="">–</option>${e.o.map((_,k)=>`<option>${"abcdefgh"[k]}</option>`).join("")}</select>`;p+=" "+f}
      else{if(!p.includes("__"))p+=" __";let b=0;p=p.replace(/__/g,()=>`<input data-x="${x}" data-i="${i}" data-b="${b++}" class="${q[1].length>18?"l":""}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Answer for ${lab}">`)}
      return `<div class="q"><span class="n">${lab}</span><div>${p}<span class="fx"></span></div></div>`}).join("");
    const opts=e.o?`<div class="opts">${e.o.map((o,k)=>`<span><b>${"abcdefgh"[k]}</b> ${o}</span>`).join("")}</div>`:"";
    return `<section class="cd ex" data-u="${e.u}"><h3><span>${e.id}</span> ${e.t}</h3><p class="in">${e.i}</p>${opts}${rows}</section>`}).join("");
  $("#exs").addEventListener("input",prog);$("#exs").addEventListener("change",prog);
}
const STUDY=["<div class=\"cd\"><h2>Overview: which tense do I use?</h2><p class=\"mu\">Read the table, then study the rules for each unit.</p><div class=\"sc2\"><table class=\"rt\"><tr><th></th><th>Present simple (I do)</th><th>Present continuous (I am doing)</th></tr><tr><td>Form</td><td>work / works</td><td>am / is / are + working</td></tr><tr><td>Use</td><td>routines, habits, general truths, scientific facts, permanent situations</td><td>actions in progress now, temporary situations, changes</td></tr><tr><td>Time words</td><td>always, usually, often, sometimes, never, every day, on Mondays</td><td>now, at the moment, today, this week, these days</td></tr><tr><td>Example</td><td><i>He brushes his teeth every morning.</i></td><td><i>She is painting the wall.</i></td></tr></table></div><p><button data-n=\"1\" data-m=\"study\">Start with Unit 1 →</button></p></div>", "<div class=\"cd\"><h2>Unit 1: Present continuous (I am doing)</h2><h3 class=\"sh\">Form: am / is / are + verb-ing</h3><div class=\"sc2\"><table class=\"rt\"><tr><th>Subject</th><th>Positive</th><th>Negative</th><th>Question</th></tr><tr><td>I</td><td>I’m working</td><td>I’m not working</td><td>Am I working?</td></tr><tr><td>he / she / it</td><td>She’s working</td><td>She isn’t working</td><td>Is she working?</td></tr><tr><td>we / you / they</td><td>They’re working</td><td>They aren’t working</td><td>Are they working?</td></tr></table></div><div class=\"sc2\"><table class=\"rt\"><tr><th>-ing spelling</th><th>Examples</th></tr><tr><td>most verbs: + ing</td><td>work → working, do → doing</td></tr><tr><td>verb ending in -e: drop the e</td><td>make → making, write → writing</td></tr><tr><td>short verb with one vowel + one consonant: double it</td><td>sit → sitting, run → running</td></tr><tr><td>-ie → -ying</td><td>lie → lying</td></tr></table></div><h3 class=\"sh\">When do we use it?</h3><div class=\"sc2\"><table class=\"rt\"><tr><th>Use</th><th>Examples</th></tr><tr><td>An action happening now, not finished</td><td><i>Sarah’s driving to work.</i> <i>‘Where’s Mark?’ ‘He’s having a shower.’</i> <i>It isn’t raining any more.</i></td></tr><tr><td>Around now: in the middle of something, but not necessarily at this moment</td><td><i>I’m reading a really good book at the moment.</i> <i>Kate’s learning Italian.</i></td></tr><tr><td>Periods around now: today, this week, this year</td><td><i>You’re working hard today.</i> <i>The company isn’t doing so well this year.</i></td></tr><tr><td>A change that has started to happen (getting, becoming, changing, improving, starting, beginning, increasing, rising, falling, growing)</td><td><i>Is your English getting better?</i> <i>The population of the world is increasing very fast.</i></td></tr></table></div><p class=\"mu\">Careful: <i>Please don’t make so much noise. I’m trying to work.</i> (not <i>I try</i>)</p><p><button data-m=\"ex\" data-n=\"1\">Practise Unit 1 →</button></p></div>", "<div class=\"cd\"><h2>Unit 2: Present simple (I do)</h2><h3 class=\"sh\">Form: base verb, + s/es for he / she / it</h3><div class=\"sc2\"><table class=\"rt\"><tr><th>Subject</th><th>Positive</th><th>Negative</th><th>Question</th></tr><tr><td>I / we / you / they</td><td>I work</td><td>I don’t work</td><td>Do you work?</td></tr><tr><td>he / she / it</td><td>He works</td><td>She doesn’t work</td><td>Does he work?</td></tr></table></div><p class=\"mu\">After <i>does / doesn’t</i> the verb has no -s: <i>Does she work?</i> (not <i>Does she works?</i>). Questions need do/does: <i>What does this word mean?</i> (not <i>What means this word?</i>)</p><div class=\"sc2\"><table class=\"rt\"><tr><th>he / she / it spelling</th><th>Examples</th></tr><tr><td>most verbs: + s</td><td>work → works, drive → drives</td></tr><tr><td>after -s, -ss, -sh, -ch, -x, -o: + es</td><td>watch → watches, finish → finishes, go → goes, do → does</td></tr><tr><td>consonant + y → ies</td><td>study → studies, try → tries</td></tr><tr><td>irregular</td><td>have → has</td></tr></table></div><h3 class=\"sh\">When do we use it?</h3><div class=\"sc2\"><table class=\"rt\"><tr><th>Use</th><th>Examples</th></tr><tr><td>Things in general, or things that happen all the time</td><td><i>Nurses look after patients in hospitals.</i> <i>The cafe opens at 7.30 in the morning.</i></td></tr><tr><td>Scientific facts and things that are always true</td><td><i>The earth goes round the sun.</i> <i>Water boils at 100 degrees Celsius.</i></td></tr><tr><td>How often we do things (always, usually, often, sometimes, never, every day, twice a year)</td><td><i>I get up at 8 o’clock every morning.</i> <i>How often do you go to the dentist?</i></td></tr><tr><td>Doing something by saying it: I promise, I suggest, I apologise, I advise, I insist, I agree, I refuse</td><td><i>I promise I won’t be late.</i> (not <i>I’m promising</i>)</td></tr></table></div><p><button data-m=\"ex\" data-n=\"2\">Practise Unit 2 →</button></p></div>", "<div class=\"cd\"><h2>Unit 3: Present continuous and present simple 1</h2><div class=\"sc2\"><table class=\"rt\"><tr><th></th><th>Present continuous (I am doing)</th><th>Present simple (I do)</th></tr><tr><td>Meaning</td><td>at or around the time of speaking; the action is not complete; temporary</td><td>in general; things that happen repeatedly; permanent</td></tr><tr><td>Now / not now</td><td><i>The water is boiling. Be careful.</i></td><td><i>Water boils at 100 degrees Celsius.</i></td></tr><tr><td>Now / not now</td><td><i>It isn’t raining now.</i></td><td><i>It doesn’t rain very much in summer.</i></td></tr><tr><td>Question</td><td><i>What are you doing?</i></td><td><i>What do you usually do at weekends?</i></td></tr><tr><td>Temporary / permanent</td><td><i>I’m living with some friends until I find a place of my own.</i></td><td><i>My parents live in London. They have lived there all their lives.</i></td></tr><tr><td>Signal words</td><td>now, at the moment, today, this week, these days</td><td>always, usually, often, every day, on Sundays, never</td></tr></table></div><h3 class=\"sh\">I always do and I’m always doing</h3><div class=\"sc2\"><table class=\"rt\"><tr><th></th><th>Meaning</th><th>Example</th></tr><tr><td>I always do</td><td>every time</td><td><i>I always go to work by car.</i></td></tr><tr><td>I’m always doing</td><td>too often, more than normal (often a complaint)</td><td><i>I’ve lost my keys again. I’m always losing them.</i> <i>Paul’s always complaining.</i></td></tr></table></div><p><button data-m=\"ex\" data-n=\"3\">Practise Unit 3 →</button></p></div>", "<div class=\"cd\"><h2>Unit 4: Present continuous and present simple 2</h2><h3 class=\"sh\">State verbs: not normally used in the continuous</h3><div class=\"sc2\"><table class=\"rt\"><tr><th>Group</th><th>Verbs</th></tr><tr><td>wants and preferences</td><td>like, want, need, prefer</td></tr><tr><td>knowing and thinking</td><td>know, realise, understand, recognise, believe, suppose, remember, mean</td></tr><tr><td>other states</td><td>belong, fit, contain, consist, seem</td></tr></table></div><p class=\"mu\"><i>I want something to eat.</i> (not <i>I’m wanting</i>) <i>Do you understand what I mean?</i> <i>Anna doesn’t seem very happy.</i></p><h3 class=\"sh\">Verbs with two uses</h3><div class=\"sc2\"><table class=\"rt\"><tr><th>Verb</th><th>Simple</th><th>Continuous</th></tr><tr><td>think</td><td>= believe, have an opinion: <i>I think Mary is Canadian.</i> <i>What do you think of my idea?</i></td><td>= consider: <i>I’m thinking about what happened.</i> <i>Nicky is thinking of giving up her job.</i></td></tr><tr><td>see, hear, smell, taste</td><td><i>Do you see that man?</i> <i>This soup doesn’t taste very good.</i></td><td>normally not used (not <i>are you seeing</i>)</td></tr><tr><td>look, feel (how somebody looks or feels now)</td><td><i>You look well today.</i> <i>How do you feel now?</i></td><td>also possible: <i>You’re looking well today.</i> <i>How are you feeling now?</i></td></tr></table></div><h3 class=\"sh\">am / is / are being</h3><div class=\"sc2\"><table class=\"rt\"><tr><th></th><th>Meaning</th><th>Example</th></tr><tr><td>is / are being</td><td>behaving in a certain way now (something you can control)</td><td><i>I can’t understand why he’s being so selfish.</i></td></tr><tr><td>is / are</td><td>a general quality, or a state you can’t control</td><td><i>He’s very selfish.</i> <i>Sam is ill.</i> (not <i>is being ill</i>) <i>Are you tired?</i></td></tr></table></div><p><button data-m=\"ex\" data-n=\"4\">Practise Unit 4 →</button></p></div>"];
let M="study",N=0;
function go(m,n){
  M=m;N=m=="ex"&&n<1?1:n;
  $$(".modes button").forEach(b=>b.classList.toggle("on",b.dataset.m==M));
  $("#tabs").innerHTML=(M=="study"?`<button data-u="0">Overview</button>`:"")+U.map((u,k)=>`<button data-u="${k+1}">Unit ${k+1}</button>`).join("");
  $$("#tabs button").forEach(b=>b.classList.toggle("on",+b.dataset.u==N));
  $("#stw").classList.toggle("hid",M!="study");$("#exw").classList.toggle("hid",M!="ex");$("#bar").classList.toggle("hid",M!="ex");$("#res").classList.toggle("hid",M!="ex"||!sent);
  if(M=="study")$("#stw").innerHTML=STUDY[N];
  else{$$(".ex").forEach(s=>s.classList.toggle("hid",s.dataset.u!=N));$("#ut").textContent=`Unit ${N}: ${U[N-1][0]}`;$("#tip").textContent=U[N-1][1]}
  window.scrollTo(0,0);
}
$("#tabs").onclick=e=>{if(e.target.dataset.u)go(M,+e.target.dataset.u)};
$(".modes").onclick=e=>{if(e.target.dataset.m)go(e.target.dataset.m,N)};
$("#stw").onclick=e=>{if(e.target.dataset.n)go(e.target.dataset.m,+e.target.dataset.n)};
function prog(){const f=$$("[data-x]"),d=f.filter(i=>i.value.trim()).length;$("#prog").textContent=`${d} of ${f.length} answered`}

$("#go").onclick=()=>{
  const n=$("#nm").value.trim(),g=$("#gr").value.trim();
  if(!n||!g){$("#err").textContent="Enter your name and your group number to continue.";return}
  S={n,g};$("#st").classList.add("hid");$("#app").classList.remove("hid");
  $("#who").textContent=`${n}, group ${g}`;build();go("study",0);prog();
};

$("#sub").onclick=()=>{
  if(sent)return;
  const f=$$("[data-x]"),empty=f.filter(i=>!i.value.trim()).length;
  if(empty&&!confirm(`${empty} answer(s) are still empty. Submit anyway?`))return;
  let tot=0,max=0,lines=[],bad=[],sum="";
  E.forEach((e,x)=>{
    let sc=0;
    e.q.forEach((q,i)=>{
      const fs=$$(`[data-x="${x}"][data-i="${i}"]`),ans=e.o?[q[1]]:q.slice(1),lab=e.L?e.L[i]:e.s+i;
      let all=true,yours=[],fix=[];
      fs.forEach((el,b)=>{
        const good=e.o?el.value===ans[0]:ok(el.value,ans[b]);
        el.classList.add(good?"g":"b");el.disabled=true;yours.push(el.value.trim()||"(blank)");
        if(!good){all=false;fix.push(e.o?`${ans[0]}. ${e.o["abcdefgh".indexOf(ans[0])]}`:show(ans[b]))}
      });
      const fx=fs[0].closest(".q").querySelector(".fx");
      fx.className="fx "+(all?"g":"");fx.textContent=all?"✓ Correct":"✗ Correct answer: "+fix.join(" / ");
      if(all)sc++;else bad.push(`${e.id} #${lab}: "${yours.join('" / "')}" → ${fix.join(" / ")}`);
    });
    tot+=sc;max+=e.q.length;lines.push(`${e.id} ${e.t}: ${sc}/${e.q.length}`);
    sum+=`<li>${e.id} ${e.t}: <b>${sc}/${e.q.length}</b></li>`;
  });
  sent=true;$("#sub").disabled=true;$("#sub").textContent="Submitted";
  const pct=Math.round(100*tot/max);
  const rep=`Student: ${S.n}\nGroup: ${S.g}\nSubmitted: ${new Date().toLocaleString()}\n\nTOTAL: ${tot}/${max} (${pct}%)\n\nBY EXERCISE\n${lines.join("\n")}\n\nMISTAKES (student answer → correct)\n${bad.length?bad.join("\n"):"None"}`;
  const r=$("#res");r.classList.remove("hid");
  r.innerHTML=`<h2>Your results</h2><p class="sc">${tot}/${max} <span class="mu" style="font-size:1rem">(${pct}%)</span></p><div class="how"><h3 class="sh">Send your results to your teacher</h3><ol><li>Press <b>Copy my results</b>.</li><li>Open WhatsApp and choose your teacher’s chat or the class group.</li><li>Paste the text into the message box and send it. Do not change it: your name and group number are at the top.</li></ol><button id="cp">Copy my results</button> <span id="cps" class="mu" role="status"></span><textarea id="rt" class="big" rows="8" readonly></textarea></div><ul class="res">${sum}</ul><p class="mu">Scroll down through each unit to see your mistakes and the correct answers.</p>`;
  const rt=$("#rt");rt.value=rep;
  $("#cp").onclick=async()=>{let c=false;try{await navigator.clipboard.writeText(rep);c=true}catch(e){rt.select();try{c=document.execCommand("copy")}catch(e2){}}
    $("#cps").textContent=c?"✓ Copied. Now paste it in WhatsApp.":"Copying did not work. Select the text below and copy it by hand."};
  r.scrollIntoView();r.focus();
};
</script>
</body>
</html>
